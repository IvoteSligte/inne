[package]
name = "inne"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { workspace = true } # Binary-only
parser = { workspace = true }
error = { workspace = true }
indentify = { workspace = true }

[workspace]
members = ["parser", "error", "format", "language-server"]

[workspace.dependencies]
parser = { package = "inne_parser", path = "./parser" }
error = { package = "inne_error", path = "./error" }
inne = { package = "inne", path = "." }
indentify = "0.1.2"
clap = { version = "4.6.7", features = ["derive"] }
